apiVersion: v1
kind: Service
metadata:
  name: ghana-genai-web-admin-angular-service
  namespace: genai
spec:
  type: NodePort
  selector:
    app: ghana-genai-web-admin-angular
  ports:
    - name: https
      port: 443
      targetPort: 443
      nodePort: 30171
    - name: http
      port: 3050
      targetPort: 3050
      nodePort: 30172
